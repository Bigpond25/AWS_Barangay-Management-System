services:
  - type: web
    name: barangay-management
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: staging/test-deploy
    healthCheckPath: /
    envVars:
      # App Configuration
      - key: APP_NAME
        value: Barangay Management System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: UTC
      - key: APP_URL
        sync: false  # Add your Render URL after first deploy
      - key: APP_KEY
        sync: false  # Add manually: base64:csKIs4IVKSOWEvpRNgCGlZBH9fFKTm3Zy+eBHcPxJ88=
      
      # Supabase Database Configuration
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.muoktkmarwtaeyoehvbd
      - key: DB_PASSWORD
        sync: false  # Add manually: aYkYWWTXG5ox6ralw!s
      - key: DB_SSLMODE
        value: require
      - key: DB_CHARSET
        value: utf8
      
      # Supabase API Configuration
      - key: SUPABASE_URL
        value: https://muoktkmarwtaeyoehvbd.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false  # Add manually from your Supabase dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Add manually from your Supabase dashboard
      
      # PostgreSQL Performance Settings
      - key: DB_DISABLE_PREPARES
        value: false
      - key: DB_TIMEOUT
        value: 60
      - key: DB_PERSISTENT
        value: false
      
      # Cache & Session (using database)
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      
      # Logging
      - key: LOG_CHANNEL
        value: stderr
      
      # Mail Configuration
      - key: MAIL_MAILER
        value: log
      
      # Other
      - key: WEBROOT
        value: /var/www/html/public